<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>پردازش تصویر مینیمال</title>
  
  <!-- Cropper.js CSS -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header class="top-bar">
    <h1>پردازشگر تصویر</h1>
    <button class="btn primary-btn" id="processBtnTop">پردازش و دانلود</button>
  </header>

  <main class="container">
    <section class="card file-upload-section">
      <div class="upload-area">
        <input type="file" id="fileInput" accept="image/*" multiple />
        <p>برای انتخاب کلیک کنید یا فایل‌ها را اینجا بکشید</p>
      </div>
      <div id="uploadStatus" class="status-text"></div>
    </section>

    <div class="settings-grid">
      <section class="card">
        <h2>ابعاد و رزولوشن</h2>
        <div class="input-group">
          <label>اندازه نهایی (cm)</label>
          <input type="number" id="sizeInput" value="15" min="1" max="100" step="0.5" />
        </div>
        <div class="input-group">
          <label>رزولوشن (DPI)</label>
          <input type="number" id="dpiInput" value="150" min="72" max="300" step="1" />
        </div>
      </section>

      <section class="card">
        <h2>فشرده‌سازی</h2>
        <div class="input-group">
          <label>حجم هدف (KB)</label>
          <input type="number" id="targetSizeInput" value="200" min="10" max="5000" step="10" />
        </div>
      </section>

      <section class="card">
        <h2>حاشیه و بوم</h2>
        <div class="input-group">
          <label>ضخامت حاشیه (px)</label>
          <input type="number" id="borderWidthInput" value="2" min="0" max="50" step="1" />
        </div>
        <div class="input-group">
          <label>توسعه بوم (px)</label>
          <input type="number" id="canvasExpandInput" value="3" min="0" max="50" step="1" />
        </div>
        <div class="input-group">
          <label>رنگ حاشیه</label>
          <input type="color" id="borderColorInput" value="#000000" />
        </div>
      </section>

      <section class="card">
        <h2>واترمارک</h2>
        <label class="checkbox-label">
          <input type="checkbox" id="stampEnabledInput" checked />
          <span>اعمال مهر (assets/stamp.png)</span>
        </label>
      </section>
    </div>

    <!-- بخش لیست پیش‌نمایش و نام‌گذاری فایل‌ها -->
    <section id="fileListCard" class="card" style="display: none;">
      <h2>لیست تصاویر و نام‌گذاری</h2>
      <div id="fileListContainer"></div>
    </section>

    <div class="bottom-action">
      <button class="btn primary-btn" id="processBtnBottom">پردازش و دانلود همه</button>
      <div id="status" class="status-text"></div>
    </div>
  </main>

  <!-- Modal برای کراپ تصاویر نامربعی -->
  <div id="cropModal" class="modal" style="display: none;">
    <div class="modal-content">
      <div class="modal-header">
        <h2>تنظیم کادر مربع</h2>
        <p id="cropModalText">تصویر مربع نیست، لطفاً بخش مورد نظر را تنظیم کنید.</p>
      </div>
      <div class="crop-container">
        <img id="cropImage" src="" alt="برای برش" />
      </div>
      <div class="modal-footer">
        <button id="confirmCropBtn" class="btn primary-btn">تایید برش</button>
      </div>
    </div>
  </div>

  <!-- Cropper.js JS -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
