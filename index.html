<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>پردازشگر تصویر</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css" />
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top-bar">
    <h1>پردازشگر تصویر</h1>
    <div class="top-actions">
      <button id="clearBtnTop">پاک کردن همه</button>
      <button id="processBtnTop" class="primary">پردازش و دانلود</button>
    </div>
  </header>

  <main class="container">
    <section class="card upload-section">
      <h2>افزودن تصویر</h2>
      <input type="file" id="fileInput" accept="image/*" multiple />
      <div id="uploadStatus"></div>
    </section>

    <section class="card settings-section">
      <h2>تنظیمات خروجی</h2>
      <div class="settings-grid">
        <label>اندازه نهایی (cm):
          <input type="number" id="sizeInput" value="15" min="1" step="0.5" />
        </label>
        <label>رزولوشن (DPI):
          <input type="number" id="dpiInput" value="96" min="72" />
        </label>
        <label>حجم هدف (KB):
          <input type="number" id="targetSizeInput" value="200" min="10" />
        </label>
        <label>ضخامت حاشیه (px):
          <input type="number" id="borderWidthInput" value="5" min="0" />
        </label>
        <label>توسعه بوم (px):
          <input type="number" id="canvasExpandInput" value="2" min="0" />
        </label>
        <label>رنگ حاشیه:
          <input type="color" id="borderColorInput" value="#000000" />
        </label>
      </div>
      <div class="checkbox-group">
        <label>
          <input type="checkbox" id="stampEnabledInput" checked />
          اعمال مهر (assets/stamp.png)
        </label>
        <label>
          <input type="checkbox" id="watermarkEnabledInput" checked />
          اعمال حروف مخفی پراکنده (n o r u z k h a n)
        </label>
      </div>
    </section>

    <section class="card" id="fileListCard">
      <h2>لیست تصاویر و نام‌گذاری</h2>
      <div id="fileListContainer"></div>
    </section>

    <div class="bottom-actions">
      <button id="clearBtnBottom">پاک کردن همه</button>
      <button id="processBtnBottom" class="primary">شروع پردازش نهایی</button>
    </div>
    
    <div id="status"></div>
  </main>

  <!-- مودال کراپ و ویرایش اولیه -->
  <div id="cropModal" class="modal">
    <div class="modal-content">
      <h2>ویرایش و برش اولیه</h2>
      <div class="editor-layout">
        <div class="image-container">
          <img id="cropImage" src="" alt="برای برش" />
        </div>
        <div class="controls-container">
          <label>چرخش: <span id="rotVal">0</span>°
            <input type="range" id="rotationSlider" min="-180" max="180" value="0" />
          </label>
          <label>روشنایی:
            <input type="range" id="brightnessSlider" min="0" max="200" value="100" />
          </label>
          <label>کنتراست:
            <input type="range" id="contrastSlider" min="0" max="200" value="100" />
          </label>
          <label>اشباع رنگ:
            <input type="range" id="saturateSlider" min="0" max="200" value="100" />
          </label>
          <button id="confirmCropBtn" class="primary">تایید و ادامه</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
