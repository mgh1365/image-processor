<!doctype html>
<html lang="fa">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Batch Image Processor</title>
  <style>
    * { box-sizing: border-box; font-family: sans-serif; }
    body { margin: 0; background: #f5f7fb; color: #1a1a1a; }
    .container { max-width: 1020px; margin: 20px auto; padding: 0 12px; }
    h1 { margin: 0 0 12px; }
    h2 { margin: 0 0 10px; font-size: 18px; }
    .panel {
      background: #fff;
      border: 1px solid #dde3ee;
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 12px;
    }

    .dropzone {
      border: 2px dashed #9eb3d1;
      border-radius: 10px;
      padding: 26px;
      text-align: center;
      color: #4f6484;
      background: #f8fbff;
      margin-bottom: 10px;
      transition: .15s;
      user-select: none;
    }
    .dropzone.active {
      border-color: #2f7cf6;
      background: #eef5ff;
      color: #245ec0;
    }

    .row { display: flex; gap: 8px; margin: 8px 0; flex-wrap: wrap; }
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    @media (max-width: 720px) { .grid2 { grid-template-columns: 1fr; } }

    label { display: block; margin: 8px 0; font-size: 14px; }
    input[type="text"], input[type="number"] {
      width: 100%;
      padding: 9px;
      border-radius: 8px;
      border: 1px solid #cdd7e8;
      outline: none;
      background: #fff;
    }
    input[type="text"]:focus, input[type="number"]:focus { border-color: #2f7cf6; }

    .check { display: flex; align-items: center; gap: 8px; margin: 8px 0; }

    button {
      border: 1px solid #cdd7e8;
      background: #fff;
      padding: 9px 12px;
      border-radius: 8px;
      cursor: pointer;
    }
    button:hover { background: #f8fbff; }
    button:disabled { opacity: .6; cursor: not-allowed; }

    button.primary {
      background: #2f7cf6;
      color: #fff;
      border-color: #2f7cf6;
    }
    button.primary:hover { background: #266ce0; }

    button.secondary { background: #f5f7fb; }

    #fileList {
      margin: 8px 0 0;
      padding-left: 18px;
      max-height: 180px;
      overflow: auto;
      border: 1px solid #edf1f8;
      border-radius: 8px;
      background: #fcfdff;
    }
    #fileList li { padding: 4px 8px; font-size: 13px; }

    #log {
      background: #0d1117;
      color: #d6e2ff;
      border-radius: 10px;
      padding: 10px;
      min-height: 190px;
      white-space: pre-wrap;
      line-height: 1.6;
      overflow: auto;
      border: 1px solid #1f2937;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>پردازش دسته‌ای تصاویر</h1>

    <section class="panel">
      <div id="dropZone" class="dropzone">فایل‌ها را اینجا Drag & Drop کنید</div>

      <div class="row">
        <button id="btnSelect">Select Files</button>
        <button id="btnClear" class="secondary">Clear List</button>
      </div>

      <ul id="fileList"></ul>
    </section>

    <section class="panel">
      <h2>تنظیمات</h2>

      <label class="check">
        <input type="checkbox" id="enableBorder" checked />
        افزودن حاشیه (2px مشکی + گوشه 5px + بوم سفید 5px)
      </label>

      <label class="check">
        <input type="checkbox" id="enableStamp" checked />
        افزودن مهر
      </label>

      <div class="row">
        <input id="stampPath" type="text" placeholder="مسیر stamp.png (یا از دکمه انتخاب کن)" />
        <button id="btnStamp" class="secondary">Choose Stamp</button>
      </div>

      <label class="check">
        <input type="checkbox" id="enableCompress" checked />
        فشرده‌سازی تا حجم هدف (KB)
      </label>

      <div class="grid2">
        <label>
          حجم هدف (KB)
          <input id="targetKB" type="number" min="1" max="10000" step="0.1" value="350" />
        </label>

        <label>
          عرض هدف (cm)
          <input id="targetWidthCm" type="number" min="1" step="0.1" value="15" />
        </label>
      </div>

      <label class="check">
        <input type="checkbox" id="openOutputs" checked />
        بعد از اتمام، خروجی‌ها باز شوند
      </label>

      <div class="row">
        <button id="btnRun" class="primary">شروع پردازش</button>
      </div>
    </section>

    <section class="panel">
      <h2>Log</h2>
      <pre id="log"></pre>
    </section>
  </div>

  <script>
    // نیازمند Electron renderer با nodeIntegration: true
    const { ipcRenderer } = require('electron');

    const dropZone = document.getElementById('dropZone');
    const btnSelect = document.getElementById('btnSelect');
    const btnClear = document.getElementById('btnClear');
    const fileListEl = document.getElementById('fileList');

    const enableBorderEl = document.getElementById('enableBorder');
    const enableStampEl = document.getElementById('enableStamp');
    const enableCompressEl = document.getElementById('enableCompress');
    const targetKBEl = document.getElementById('targetKB');
    const targetWidthCmEl = document.getElementById('targetWidthCm');
    const openOutputsEl = document.getElementById('openOutputs');
    const stampPathEl = document.getElementById('stampPath');
    const btnStamp = document.getElementById('btnStamp');
    const btnRun = document.getElementById('btnRun');
    const logEl = document.getElementById('log');

    let files = [];

    function log(msg) {
      logEl.textContent += msg + "\\n";
      logEl.scrollTop = logEl.scrollHeight;
    }

    function renderFiles() {
      fileListEl.innerHTML = "";
      files.forEach((p) => {
        const li = document.createElement("li");
        li.textContent = p;
        fileListEl.appendChild(li);
      });
    }

    function addFiles(paths) {
      const set = new Set(files);
      (paths || []).forEach((p) => {
        if (p && typeof p === "string") set.add(p.trim());
      });
      files = [...set].filter(Boolean);
      renderFiles();
    }

    // Drag & Drop
    ["dragenter", "dragover"].forEach((ev) => {
      dropZone.addEventListener(ev, (e) => {
        e.preventDefault();
        e.stopPropagation();
        dropZone.classList.add("active");
      });
    });

    ["dragleave", "drop"].forEach((ev) => {
      dropZone.addEventListener(ev, (e) => {
        e.preventDefault();
        e.stopPropagation();
        dropZone.classList.remove("active");
      });
    });

    dropZone.addEventListener("drop", (e) => {
      const arr = [];
      for (const f of e.dataTransfer.files) {
        if (f.path) arr.push(f.path);
      }
      addFiles(arr);
      log("+ " + arr.length + " فایل اضافه شد (Drag & Drop).");
    });

    // Select files button
    btnSelect.addEventListener("click", async () => {
      try {
        const selected = await ipcRenderer.invoke("select-files");
        addFiles(selected);
        log("+ " + (selected || []).length + " فایل اضافه شد (Select).");
      } catch (err) {
        log("خطا در انتخاب فایل: " + (err.message || err));
      }
    });

    // Clear list
    btnClear.addEventListener("click", () => {
      files = [];
      renderFiles();
      log("لیست فایل‌ها پاک شد.");
    });

    // Pick stamp
    btnStamp.addEventListener("click", async () => {
      try {
        const p = await ipcRenderer.invoke("pick-stamp");
        if (p) {
          stampPathEl.value = p;
          log("مهر انتخاب شد: " + p);
        }
      } catch (err) {
        log("خطا در انتخاب مهر: " + (err.message || err));
      }
    });

    // Run processing
    btnRun.addEventListener("click", async () => {
      if (!files.length) {
        log("هیچ فایلی انتخاب نشده.");
        return;
      }

      const payload = {
        filePaths: files,
        enableBorder: enableBorderEl.checked,
        enableStamp: enableStampEl.checked,
        enableCompress: enableCompressEl.checked,
        targetKB: Number(targetKBEl.value || 350),
        targetWidthCm: Number(targetWidthCmEl.value || 15),
        openOutputs: openOutputsEl.checked,
        stampPath: (stampPathEl.value || "").trim()
      };

      btnRun.disabled = true;
      log("شروع پردازش...");

      try {
        const out = await ipcRenderer.invoke("process-images", payload);

        let ok = 0, fail = 0;
        for (const r of out) {
          if (r.ok) {
            ok++;
            log("✓ " + r.output + " | size=" + Number(r.sizeKB || 0).toFixed(1) + "KB | q=" + r.quality + (r.scaleApplied ? (" | scale=" + r.scaleApplied) : ""));
          } else {
            fail++;
            log("✗ " + r.input + " -> " + r.error);
          }
        }

        log("اتمام. موفق: " + ok + " | ناموفق: " + fail);
        alert("اتمام پردازش\\nموفق: " + ok + "\\nناموفق: " + fail);
      } catch (err) {
        log("خطای پردازش: " + (err.message || err));
        alert("خطا: " + (err.message || err));
      } finally {
        btnRun.disabled = false;
      }
    });

    // startup check
    try {
      if (!ipcRenderer) throw new Error("ipcRenderer unavailable");
      log("Renderer آماده است.");
    } catch (e) {
      log("خطا: این صفحه باید داخل Electron اجرا شود. " + e.message);
    }
  </script>
</body>
</html>
