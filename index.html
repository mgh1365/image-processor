
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Processor</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <h1>پردازشگر تصاویر</h1>

    <div id="dropZone">
        فایل‌ها را اینجا رها کنید
        <br><br>
        یا
        <br><br>
        <button id="selectBtn">انتخاب فایل</button>
        <input type="file"
               id="fileInput"
               multiple
               accept="image/*"
               hidden>
    </div>

    <div class="options">

        <label>
            <input type="checkbox" id="borderCheck" checked>
            حاشیه
        </label>

        <label>
            <input type="checkbox" id="stampCheck" checked>
            مهر
        </label>

        <label>
            <input type="checkbox" id="qualityCheck" checked>
            کیفیت
        </label>

    </div>

    <div class="inputs">

        <div>
            <label>عرض (سانتیمتر)</label>
            <input
                    type="number"
                    id="widthCm"
                    value="15"
                    step="0.1"
                    min="1">
        </div>

        <div>
            <label>حجم هدف (KB)</label>
            <input
                    type="number"
                    id="targetSize"
                    value="500"
                    step="0.1"
                    min="1"
                    max="10000">
        </div>

    </div>

    <div class="buttons">

        <button id="runBtn">
            اجرا
        </button>

        <button id="clearBtn">
            پاک کردن
        </button>

    </div>

    <h3>
        فایل‌های انتخاب شده
    </h3>

    <div id="fileList"></div>

</div>

<script src="script.js"></script>

</body>
</html>
